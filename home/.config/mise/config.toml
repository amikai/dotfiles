[tools]
python = "latest"
uv = "latest"
node = "latest"
bun = "latest"
nub = "latest"
aube = "latest"
# Go tools are listed before go itself, so they win on PATH over the copies
# that go.nvim `go install`s into go's bin directory.
# gopls has no prebuilt release and is not in the registry, so it stays on the
# go backend.
"go:golang.org/x/tools/gopls" = "latest"
golangci-lint = "latest"
gotestsum = "latest"
go = "latest"
# The mise Rust backend provisions toolchains and components through rustup.
rust = { version = "latest", components = ["rust-analyzer", "clippy"] }
# Python language server used by Neovim (delance-langserver), outside Mason.
"npm:@delance/runtime" = { version = "latest", allow_low_downloads = true }
# TypeScript 7 (native); tsc also serves LSP via `tsc --lsp --stdio`
"npm:typescript" = "latest"
pnpm = "12.6.0"
# Coding agent CLIs. mise owns their updates: it checks every hour and takes a
# new release right away instead of waiting out the default 24h minimum
# release age, which still applies to every other tool.
codex = { version = "latest", auto_update = "1h", minimum_release_age = "0s" }
claude-code = { version = "latest", auto_update = "1h", minimum_release_age = "0s" }
agy = { version = "latest", auto_update = "1h", minimum_release_age = "0s" }
grok = { version = "latest", auto_update = "1h", minimum_release_age = "0s" }
# pi refreshes its extensions after every install, including the hourly ones.
pi = { version = "latest", auto_update = "1h", minimum_release_age = "0s", postinstall = "pi update --extensions --no-approve" }

# Packages installed by `mise bootstrap packages apply`. Casks stay in
