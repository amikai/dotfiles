# ===== Linux =====
# Reserved for Linux machines; restrict each entry with os = "linux", e.g.
# "apt:build-essential" = { os = "linux" }

[settings]
python.uv_venv_auto = "create|source"
# Use mise's embedded aube installer for npm-backed tools.
npm.package_manager = "aube"
idiomatic_version_file_enable_tools = ["node", "python", "rust"]

[env]
# Keep nub on mise's selected Node rather than provisioning a second runtime.
NODE_EXECUTABLE = { value = "{{ tools.node.path }}/bin/node", tools = true }
