[tools]
python = "latest"
uv = "latest"
node = "latest"
bun = "latest"
nub = "latest"
aube = { version = "latest", matching = "aube-v" }
go = "latest"
# The mise Rust backend provisions toolchains and components through rustup.
rust = { version = "latest", components = ["rust-analyzer", "clippy"] }
# Python language server used by Neovim (delance-langserver), outside Mason.
"npm:@delance/runtime" = { version = "latest", allow_low_downloads = true }
# Pi coding agent harness
"npm:@earendil-works/pi-coding-agent" = { version = "latest", allow_low_downloads = true }

# mise 2026.9.1's registry still points to jdx/aube and its old signer identity.
# Use the canonical repository, retaining GitHub artifact attestation checks.
[tool_alias]
aube = "github:aubepkg/aube"

# Packages installed by `mise bootstrap packages apply`. Casks stay in
# script/Brewfile, installed with `brew bundle`. Some formulae installed
# with `brew install` are not declared here yet; do not run
# `mise bootstrap packages prune` until they are, or it will remove them.
[bootstrap.packages]
