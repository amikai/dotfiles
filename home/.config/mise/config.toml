# ===== Linux =====
# Reserved for Linux machines; restrict each entry with os = "linux", e.g.
# "apt:build-essential" = { os = "linux" }

# Set by `mise bootstrap user apply` (`mise run login-shell`), which also adds
# the shell to /etc/shells.
[bootstrap.user]
login_shell = "/opt/homebrew/bin/zsh"

# A LaunchAgent that checks the tools with `auto_update` once an hour, so they
# update without a shell prompt or a launch waiting on it. Installed by
# `mise bootstrap services apply` (`mise run services`).
[bootstrap.services.mise-tool-update]
builtin = "tool-update"

[settings]
python.uv_venv_auto = "create|source"
# Use mise's embedded aube installer for npm-backed tools.
npm.package_manager = "aube"
idiomatic_version_file_enable_tools = ["node", "python", "rust"]
# home/ mirrors $HOME. Group roots and entries without a `source` resolve from
# here. Relative `source` paths cannot be used instead: they resolve from
# ~/.config/mise, where this file is linked, not from the repository. So the
# repository must be cloned to ~/Workspace/dotfiles.
dotfiles.root = "~/Workspace/dotfiles/home"

[env]
# Keep nub on mise's selected Node rather than provisioning a second runtime.
# Guarded: tools.node is absent while node is not installed (e.g. mid-upgrade).
NODE_EXECUTABLE = { value = "{% if tools.node is defined %}{{ tools.node.path }}/bin/node{% endif %}", tools = true }
# mise updates Claude Code (see [tools]); stop its own updater from competing.
DISABLE_AUTOUPDATER = "1"

# Symlinks deployed by `mise dot apply` (`mise run link`). The group links each
# file that Git tracks, so untracked files and tool scratch files stay
# unlinked; directories that tools write state into (herdr sockets and logs)
# get per-file links.
[dotfile_groups.home]
root = "."
target = "~"
manifest = "git"

# Linked whole instead of per file: git, zed and karabiner replace their files
# on write, which would turn per-file links into regular files, and nvim is a
# separate clone. Group entries are carved out of the per-file walk.
[dotfile_groups.home.entries]
"~/.config/ghostty" = { mode = "symlink" }
"~/.config/git" = { mode = "symlink" }
"~/.config/karabiner" = { mode = "symlink" }
"~/.config/nvim" = { mode = "symlink" }
"~/.config/sheldon" = { mode = "symlink" }
"~/.config/wezterm" = { mode = "symlink" }
"~/.config/zed" = { mode = "symlink" }
